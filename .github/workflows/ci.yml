name: CI

# 触发纪律（用户明令 2026-10-11「不要老是触发 CI，损耗太多 action 额度；
# 不是不 push，而是 push 跳过 CI」）：push 照常做（代码同步/备份是硬要求），
# 但 push 与 PR 都不自动跑 CI —— 本仓全流程本地验证（总控亲跑全量+四门）
# 为硬门，CI 是**按需手动**的备用复核面。
# 需要跑时：GitHub UI 的 Actions → CI → Run workflow，或 `gh workflow run ci.yml`。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project + static gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff mypy

      - name: Ruff (lint)
        run: python -m ruff check src tests

      - name: Mypy (type check)
        run: python -m mypy src/elc

      - name: Compileall (syntax gate)
        run: python -m compileall -q src behavioral_baselines docs/run_post_bf_regression.py

      - name: Pytest (full behavioral + architecture regression)
        run: python -m pytest
