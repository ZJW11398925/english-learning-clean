name: CI

# 额度纪律（用户明令 2026-10-11「不要老是触发 CI，损耗太多 action 额度」）：
# 本仓 workflow 全程本地验证（总控亲跑全量 + 四门）为硬流程，push 是
# 备份/里程碑动作而非每刀动作 —— 三条节流：
#   1) concurrency：同一 ref 的连续 push 只跑最新一次（旧跑自动取消）；
#   2) paths-ignore：纯文档/台账/生成数据改动不触发（代码与测试才触发）；
#   3) 流程侧（AGENTS.md）：不主动 push；批量 push（多刀合一），逐刀 push 禁止。
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "aoci.txt"
      - "aoci.meta.txt"
      - "aoci.code.txt"
      - "AGENTS.md"
      - "content_src/**"
      - "curriculum/**"
      - "worlds/**"
      - ".aoci/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project + static gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff mypy

      - name: Ruff (lint)
        run: python -m ruff check src tests

      - name: Mypy (type check)
        run: python -m mypy src/elc

      - name: Compileall (syntax gate)
        run: python -m compileall -q src behavioral_baselines docs/run_post_bf_regression.py

      - name: Pytest (full behavioral + architecture regression)
        run: python -m pytest
