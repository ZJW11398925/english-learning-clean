name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project + static gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff mypy

      - name: Ruff (lint)
        run: python -m ruff check src tests

      - name: Mypy (type check)
        run: python -m mypy src/elc

      - name: Compileall (syntax gate)
        run: python -m compileall -q src behavioral_baselines docs/run_post_bf_regression.py

      - name: Pytest (full behavioral + architecture regression)
        run: python -m pytest
