[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elc"
version = "0.1.0"
description = "english-learning-clean V1 runtime — Phase 0 repository bootstrap skeleton"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# --- Static gates (CI: ruff → mypy → compileall → pytest) -------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["behavioral_baselines", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names — catches missing imports)
    "I",   # import order
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["elc"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# behavioral_baselines reference implementations are byte-pinned baseline
# evidence (v1.0.1 exception exhausted); they are compiled, never type-gated.
exclude = "behavioral_baselines/"
